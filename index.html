<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="styles.css">
      <meta property="og:title" content="Yaw Calculator: A Minecraft Utility">
      <meta property="og:type" content="website">
      <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/0/04/Yaw_Angles_in_Minecraft_%28Open_Graph_friendly%29.png">
      <meta property="og:description" content="Yaw Calculator and Overworld-to-Nether Converter for Minecraft. Finding your Portal on the Nether Roof is easier than ever!">
      <title>Yaw Calculator</title>
   </head>
   <body>
	  <div id="sr-announcer" role="status" aria-live="polite" 
	  	style="
		  position: absolute;
		  width: 1px;
		  height: 1px;
		  margin: -1px;
		  padding: 0;
		  overflow: hidden;
		  clip: rect(0 0 0 0);
		  border: 0;
		">
	  </div>
      <header>
         <h1 class="head1">Yaw Calculator: A Minecraft Utility<br>(w/ Nether Portal Calculator)</h1>
      </header>
      <div id="app">
         <form id="current-form">
			<fieldset>
	            <legend id="start-legend"><h2>Where are you standing at?</h2></legend>
	            <div>
	               <label for="locX">Location X:</label>
	               <input type="number" autocomplete="off" step="0.001" name="locX" id="locX" >
	            </div>
	            <div>
	               <label for="locZ">Location Z:</label>
	               <input type="number" autocomplete="off" step="0.001" name="locZ" id="locZ" >
	            </div>
	            <div class = "nether">
	               <input type="checkbox" id="netherEquivCurrent" name="netherEquivCurrent" >
	               <label for="netherEquivCurrent">Starting Portal in Overworld coordinates, convert to Nether coordinates</label>
	            </div>
			</fieldset>
			<div class="swap-div">
				<button id="swap-coords" class="swap">Swap...</button>
			</div>
			<fieldset>
	            <legend id="dest-legend"><h2>Where do you want to go?</h2></legend>
	            <div>
	               <label for="destX">Location X:</label>
	               <input type="number" autocomplete="off" step = "0.001" name="destX" id="destX" >
	            </div>
	            <div>
	               <label for="destZ">Location Z:</label>
	               <input type="number" autocomplete="off" step="0.001" name="destZ" id="destZ" >
	            </div>
	            <div class = "nether">
	               <input type="checkbox" id="netherEquivDest" name="netherEquivDest" >
	               <label for="netherEquivDest">Destination Portal in Overworld coordinates, convert to Nether coordinates</label>
	            </div>
			</fieldset>
			<fieldset>
				<legend id="version-legend"><h2> Which version of Minecraft are you using? </h2></legend>
				<div class = "cardinal-system-convention">
					<input type="radio" id="pre" name="cardinal" value="pre" >
					<label for="pre"> Pre 1.21.8 (or pre-25w37a)</label>
					<input type="radio" id="onwards" name="cardinal" value="onwards"  checked>
					<label for="onwards"> 1.21.8 onwards (25w37a onwards)</label>
				</div>
			</fieldset>
            <div id = "but">
               <button type="submit">Submit</button>
            </div>
         </form>
		 <div class="fermatter abc">
		    <output form="current-form" for="locX locZ destX destZ netherEquivCurrent netherEquivDest pre onwards" id="facing-line" class="hello-result"></output>
			<button id = "facing-line-copy" class="copy" onclick="copyInnerHTML('facing-line')">Copy Facing Line</button>
		 </div>
         <div class="abc">
            <output form="current-form" for="locX locZ netherEquivCurrent" id="netherstart" class = "hello-result"></output>
            <button id="start-copy" class="copy" onclick="copyInnerHTML('netherstart')">Copy Start</button>
         </div>
         <div class="abc">
            <output form="current-form" for="destX destZ netherEquivDest" id="netherend" class="hello-result"></output>
            <button id="end-copy" class="copy" onclick="copyInnerHTML('netherend')">Copy Destination</button>
         </div>
         <div class="abc">
            <output form="current-form" for="locX locZ destX destZ netherEquivCurrent netherEquivDest" id="result" class="hello-result"></output>
            <button id="result-copy" class="copy" onclick="copyInnerHTML('result')">Copy Yaw Angle</button>
         </div>
         <div id="footer">
            <a href="https://github.com/FlyingSaturn/yawcalc">The Github Repository</a>
            <p>Made with &lt;3</p>
         </div>
      </div>
      <script src="script.js"></script>
   </body>
</html>
